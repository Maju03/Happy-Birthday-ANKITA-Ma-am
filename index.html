<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Ma'am</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--board:#2a0f1f;--board2:#5a1e3c;--chalk:#fdf0ea;--gold:#f2c48d;--rose:#ff8fa8;--blush:#ffd1dc;--frame:#c58a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--board:#240c1a}}
:root[data-theme="dark"]{--board:#240c1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--chalk);font:1.2rem/1.6 "Cormorant Garamond",Georgia,serif;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
background-image:linear-gradient(rgba(255,209,220,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,209,220,.045) 1px,transparent 1px),radial-gradient(ellipse at 50% 0,var(--board2),var(--board) 75%);background-size:40px 40px,40px 40px,auto}
.topo{position:fixed;inset:0;width:100%;height:100%;opacity:.15;pointer-events:none}
#st{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px 70px;max-width:620px;margin:0 auto;animation:in .6s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,.s{font-family:"Dancing Script",cursive;font-weight:700;margin:0}
h1{font-size:clamp(2.8rem,13vw,5rem);line-height:1.05;color:var(--gold)}
h2{font-size:clamp(2rem,8vw,2.8rem);color:var(--blush)}
p{margin:12px 0 0}
.heart{font-size:5.5rem;line-height:1;color:var(--rose);text-shadow:0 0 30px var(--rose);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-style:italic;opacity:.7;font-size:1.05rem;pointer-events:none}
.fig{width:100%;border:0;padding:0;background:none}
.fig img{display:block;border-radius:14px;box-shadow:0 0 40px rgba(255,143,168,.22);width:100%;max-height:52vh;object-fit:cover;object-position:center 30%}
.tbk{display:flex;justify-content:space-between;font-size:.95rem;opacity:.7;padding:6px 2px 0}
.cap{font-family:"Dancing Script",cursive;font-size:clamp(1.6rem,6vw,2.1rem);color:var(--chalk);margin-top:14px;line-height:1.2}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,209,220,.3)}
.dots i.on{background:var(--rose)}
.poem span{display:block;opacity:0;animation:in .8s ease forwards}
.poem .g{height:14px}
.poem{font-size:clamp(1.15rem,4.4vw,1.4rem);font-style:italic;line-height:1.55;max-height:68vh;overflow:auto;scrollbar-width:none;border:0;outline:0}
.poem::-webkit-scrollbar{display:none}
.btn{font:700 1.15rem "Cormorant Garamond",serif;background:var(--gold);color:#3a0d1f;border:0;border-radius:999px;padding:12px 26px;margin-top:20px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--blush);outline-offset:3px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){#st,.poem span{animation:none;opacity:1}.heart{animation:none}}
</style></head>
<body>
<canvas id="cf"></canvas>
<svg class="topo" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#ffd1dc" stroke-width="1.2" aria-hidden="true">

<g transform="translate(160 640)"><ellipse rx="50" ry="34" transform="rotate(25)"/><ellipse rx="110" ry="76" transform="rotate(22)"/><ellipse rx="180" ry="120" transform="rotate(20)"/><ellipse rx="260" ry="170" transform="rotate(16)"/></g></svg>
<main id="st" aria-live="polite"></main>
<div class="hint" id="hint">tap anywhere</div>
<script>
// ---- Edit these ----
var NAME="";   // her name, e.g. "Sharmistha"
var FROM="";   // your name
var POEM=[
"Some people are a place, not a person.",
"You are mine.",
"Warm as a monsoon evening,",
"steady as a bridge that never complains,",
"and missing from every map,",
"because you are where my directions end.","",
"I measured the world in metres and degrees,",
"drew every line the way it should be.",
"Then you smiled, and every plan I made",
"quietly rearranged itself around you.","",
"So today, let the rivers run toward you,",
"let the mountains bow a little,",
"and let every compass in the world",
"agree, for once, on where its north is.","",
"Happy Birthday, my favourite coordinate."];
var WISHES=["May every road you take lead somewhere beautiful.","May your days be full of laughter and your nights full of stars.","May you always feel as special as you make everyone feel."];

var $=function(i){return document.getElementById(i)},st=$("st"),i=0,cv=$("cf"),cx=cv.getContext("2d"),parts=[],raf=0;

function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function burst(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 for(var k=0;k<n;k++){var a=Math.random()*6.28,s=3+Math.random()*7;parts.push({x:innerWidth/2,y:innerHeight/3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:3+Math.random()*4,c:cols[k%6],l:100+Math.random()*50})}
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(){raf=0;cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(function(p){return p.l-->0});
 parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.99;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});
 if(parts.length)raf=requestAnimationFrame(tick)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var N=PHOTOS.length,total=N+4;
function dots(k){var h='<div class="dots">';for(var j=0;j<N;j++)h+='<i'+(j===k?' class="on"':'')+'></i>';return h+'</div>'}
function show(n){
 var h="",who=NAME?esc(NAME)+" Ma'am":"Ma'am";
 if(n===0){h='<div class="heart">&#9829;</div><h2 style="margin-top:18px">Something is waiting for you</h2><p>Tap to open it.</p>';$("hint").textContent="tap to open"}
 else if(n===1){h='<h1>Happy Birthday,<br>'+who+'</h1><p>Today the world got a little warmer, and it was because of you.</p>';$("hint").textContent="tap for our memories";burst(140)}
 else if(n<=N+1){var k=n-2,p=PHOTOS[k];h='<div class="fig"><img src="'+p.src+'" alt="'+esc(p.cap)+'"><div class="tbk"><span>Sheet '+(k+1)+' of '+N+'</span><span>22.57&deg;N, 88.36&deg;E</span></div></div><div class="cap">'+esc(p.cap.replace(/^Fig\. \d+: /,""))+'</div>'+dots(k);$("hint").textContent=(k<N-1)?"tap for the next one":"tap for a poem"}
 else if(n===N+2){h='<h2>A poem for you</h2><div class="poem" style="margin-top:14px">'+POEM.map(function(l,j){return l?'<span style="animation-delay:'+(j*.45)+'s">'+esc(l)+'</span>':'<span class="g"></span>'}).join("")+'</div>';$("hint").textContent="tap for my wishes"}
 else{h='<h1>Best wishes</h1><p style="margin-top:18px">'+WISHES.map(esc).join("<br><br>")+'</p>'+(FROM?'<div class="s" style="font-size:2rem;color:var(--gold);margin-top:20px">With love, '+esc(FROM)+'</div>':'')+'<button class="btn" id="re">Watch again</button>';$("hint").textContent="";burst(200)}
 st.style.animation="none";st.offsetWidth;st.style.animation="";st.innerHTML=h;
 var r=$("re");if(r)r.onclick=function(e){e.stopPropagation();i=0;show(0)};
 var po=st.querySelector(".poem");if(po)po.scrollTop=0}
function next(){if(i<total-1){i++;show(i)}}
document.body.addEventListener("click",next);
addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){if(e.target.id==="re")return;e.preventDefault();next()}});
